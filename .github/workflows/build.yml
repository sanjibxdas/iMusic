name: Build iMusic (iOS 12.5.8)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA & DEB
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app
          xcodebuild -version

      - name: Build Archive
        run: |
          xcodebuild \
            -project "iMusic.xcodeproj" \
            -scheme "iMusic" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "build/iMusic.xcarchive" \
            -destination "generic/platform=iOS" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            archive

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "build/iMusic.xcarchive/Products/Applications/iMusic.app" Payload/
          codesign -s - --force --deep Payload/iMusic.app
          zip -qr iMusic.ipa Payload
          echo "IPA packaging complete: iMusic.ipa"

      - name: Package DEB (Sileo / Filza Compliant)
        run: |
          mkdir -p deb_package/Applications
          cp -R "build/iMusic.xcarchive/Products/Applications/iMusic.app" deb_package/Applications/
          chmod 755 deb_package/Applications/iMusic.app/iMusic
          codesign -s - --force --deep deb_package/Applications/iMusic.app

          mkdir -p deb_root
          printf "2.0\n" > deb_root/debian-binary

          mkdir -p deb_control
          cat << 'EOF' > deb_control/control
          Package: com.user.imusic
          Name: iMusic
          Version: 1.0.0
          Architecture: iphoneos-arm
          Maintainer: iMusic Developer
          Section: Applications
          Priority: optional
          Installed-Size: 1024
          Depends: firmware (>= 12.0)
          Description: Native YouTube Music player for iOS 12 inspired by Apple Music.
          EOF

          # Standard Unix line endings for control file
          tr -d '\r' < deb_control/control > deb_control/control.clean
          mv deb_control/control.clean deb_control/control

          # Create control.tar.gz
          tar --numeric-owner --owner=0 --group=0 -czvf deb_root/control.tar.gz -C deb_control control

          # Create data.tar.gz with strict directory hierarchy
          tar --numeric-owner --owner=0 --group=0 -czvf deb_root/data.tar.gz -C deb_package Applications

          # Pack standard Debian archive
          ar -cr iMusic.deb deb_root/debian-binary deb_root/control.tar.gz deb_root/data.tar.gz
          echo "DEB packaging complete: iMusic.deb"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iMusic-IPA
          path: iMusic.ipa
          if-no-files-found: error

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iMusic-DEB
          path: iMusic.deb
          if-no-files-found: error
